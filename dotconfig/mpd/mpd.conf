audio_output {
type "pipewire"
name "PipeWire Sound Server"
}

#audio_output {
#type "pulse"
#name "Pulse audio"
#}

#enabling visualizer for ncmpcpp
audio_output {
    type                    "fifo"
    name                    "my_fifo"
    path                    "/tmp/mpd.fifo"
    format                  "44100:16:2"
}
